<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="System alerts and notifications for Smart Solar Water Purification System">
    <title>Alerts - Smart Solar Water Purification</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="navbar-brand">
                <svg class="navbar-brand-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Smart Solar Purification</span>
            </a>

            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">Dashboard</a></li>
                <li><a href="monitoring.html" class="nav-link">Monitoring</a></li>
                <li><a href="alerts.html" class="nav-link active">Alerts</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="flex-between mb-xl">
                <div>
                    <h1>System Alerts</h1>
                    <p>Notifications and event history</p>
                </div>
                <button id="refreshBtn" class="btn btn-outline">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Refresh
                </button>
            </div>

            <!-- Alert Summary Cards -->
            <div class="grid grid-4 mb-xl">
                <div class="card">
                    <div class="card-body text-center">
                        <div style="font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-info);"
                            id="totalAlerts">0</div>
                        <div style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">Total Alerts
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body text-center">
                        <div style="font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-error);"
                            id="errorCount">0</div>
                        <div style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">Errors</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body text-center">
                        <div style="font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-warning);"
                            id="warningCount">0</div>
                        <div style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">Warnings</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body text-center">
                        <div style="font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-success);"
                            id="successCount">0</div>
                        <div style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">Success</div>
                    </div>
                </div>
            </div>

            <!-- Alerts List -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Recent Alerts</h3>
                    <span id="lastUpdated" class="text-sm" style="color: var(--color-text-tertiary);">Loading...</span>
                </div>
                <div class="card-body">
                    <div id="alertsList">
                        <!-- Alerts will be inserted here -->
                        <div class="text-center p-xl">
                            <div class="spinner" style="margin: 0 auto;"></div>
                            <p class="mt-md" style="color: var(--color-text-tertiary);">Loading alerts...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/alerts.js"></script>
</body>

</html>
